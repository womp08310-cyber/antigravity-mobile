<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Antigravity</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />

<script>
// Log fetch requests for diagnostics
(function() {
    var _origFetch = window.fetch;
    window.fetch = function() {
        var url = arguments[0];
        console.log("[Antigravity FETCH START] " + url);
        return _origFetch.apply(this, arguments).then(function(res) {
            console.log("[Antigravity FETCH SUCCESS] " + url + " -> " + res.status);
            return res;
        }).catch(function(err) {
            console.error("[Antigravity FETCH ERROR] " + url + " -> " + err);
            throw err;
        });
    };
})();

// Global Error Overlay for Android Diagnostics
window.onerror = function(msg, url, line, col, error) {
    console.error("[Antigravity Error]", msg, url, line, col, error);
    var div = document.getElementById("__diag_err");
    if (!div) {
        div = document.createElement("div");
        div.id = "__diag_err";
        div.style = "position:fixed;top:0;left:0;right:0;bottom:0;background:#200a0a;color:#ff9999;padding:24px;font-family:monospace;font-size:13px;z-index:9999999;overflow:auto;white-space:pre-wrap;line-height:1.5;";
        (document.body || document.documentElement).appendChild(div);
    }
    div.innerHTML = "<h2 style='color:#ff5555;margin-top:0;'>⚠️ Antigravity Boot Error</h2>" +
        "<b>Message:</b> " + msg + "\n\n" +
        "<b>Source:</b> " + url + ":" + line + ":" + col + "\n\n" +
        "<b>Stack:</b>\n" + (error ? (error.stack || error) : "No stack trace available");
};

window.onunhandledrejection = function(event) {
    console.error("[Antigravity Unhandled Rejection]", event.reason);
    var div = document.getElementById("__diag_rejection");
    if (!div) {
        div = document.createElement("div");
        div.id = "__diag_rejection";
        div.style = "position:fixed;bottom:0;left:0;right:0;max-height:45%;background:#2a1010;color:#ffbbbb;border-top:2px solid #ff4444;padding:16px;font-family:monospace;font-size:12px;z-index:9999999;overflow:auto;white-space:pre-wrap;";
        (document.body || document.documentElement).appendChild(div);
    }
    var reason = event.reason;
    div.innerHTML = "<h3 style='color:#ff7777;margin:0 0 8px;'>⚠️ Unhandled Promise Rejection</h3>" +
        (reason ? (reason.stack || reason.message || reason) : "Unknown rejection");
};

window.__APP_CONFIG__ = {
    "productName": "antigravity",
    "csrfToken": "34b556f6-f5bd-48d3-9d78-902ae3f98aac",
    "appVersion": "2.25.0",
    "releaseChannel": "stable",
    "devMode": false
};

// Android Native Polyfills
window.nativeStorage = {
    getItems: function() {
        try {
            var json = window.AndroidBridge ? AndroidBridge.getStorageItems() : '{}';
            return Promise.resolve(JSON.parse(json || '{}'));
        } catch(e) {
            return Promise.resolve({});
        }
    },
    updateItems: function(changes) {
        try {
            if (window.AndroidBridge) AndroidBridge.updateStorageItems(JSON.stringify(changes || {}));
            return Promise.resolve();
        } catch(e) {
            return Promise.resolve();
        }
    },
    onChanged: function(cb) { return function() {}; }
};

window.electronNative = {
    getZoomLevel: function() { return 1.0; },
    getPathForFile: function(f) { return f ? f.path : undefined; },
    setTitleBarOverlay: function() {},
    minimize: function() {},
    maximize: function() {},
    unmaximize: function() {},
    isMaximized: function() { return Promise.resolve(true); },
    close: function() {},
    toggleDevTools: function() {},
    zoomIn: function() {},
    zoomOut: function() {},
    resetZoom: function() {},
    openExternal: function(url) { if (window.AndroidBridge) AndroidBridge.openExternal(url); },
    revealInFilePicker: function() {},
    showContextMenu: function() {},
    closeContextMenu: function() {}
};

window.dialog = {
    showOpenDialog: function() { return Promise.resolve({ canceled: true, filePaths: [] }); },
    showOpenMultipleFolderDialog: function() { return Promise.resolve({ canceled: true, filePaths: [] }); }
};

window.nativeNotifications = {
    send: function() {},
    openSystemPreferences: function() {},
    onClicked: function() { return function() {}; }
};

window.deepLink = {
    getStoredDeepLink: function() {
        var link = window.AndroidBridge ? AndroidBridge.getStoredDeepLink() : null;
        return Promise.resolve(link);
    },
    onDeepLink: function(cb) {
        window.__deepLinkCb = cb;
        return function() { window.__deepLinkCb = null; };
    }
};

window.agent = {
    updateActiveAgentCount: function(cnt) {
        if (window.AndroidBridge) AndroidBridge.updateActiveAgentCount(cnt);
        return Promise.resolve();
    }
};

window.extensions = { sendAuthorities: function() { return Promise.resolve(); } };
window.logs = { getElectronLogs: function() { return Promise.resolve(''); } };
window.ide = { isInstalled: function() { return Promise.resolve(false); } };
window.wsl = { getState: function() { return Promise.resolve(null); }, connect: function() { return Promise.resolve(false); } };
window.electronUpdater = {
    getState: function() { return Promise.resolve({ status: 'up-to-date' }); },
    checkForUpdates: function() { return Promise.resolve(); },
    onStateChanged: function() { return function() {}; }
};

// Polyfill Node process
window.process = window.process || {};
window.process.env = window.process.env || {};
if (!window.process.env.NODE_ENV) {
    window.process.env.NODE_ENV = "production";
}
if (!window.process.platform) {
    window.process.platform = "linux";
}

if (window.customElements) {
    var origDef = window.customElements.define;
    window.customElements.define = function(name, constructor, options) {
        if (!window.customElements.get(name)) {
            origDef.call(window.customElements, name, constructor, options);
        }
    };
}
</script>

    <link rel="stylesheet" href="/jetbox.css" />
    <link rel="stylesheet" href="/compiled_tailwind.css" />

    <style>
      html, body {
        height: 100%;
        background-color: #131313;
        color: #e5e7eb;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #131313;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 20px;
      }
      .loader-logo {
        font-size: 56px;
        margin-bottom: 20px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .loader-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        color: #FAFAFA;
      }
      .loader-sub {
        font-size: 14px;
        color: #9CA3AF;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
    </style>
  </head>
  <body class="dark bg-[#131313] text-[#e5e7eb]">
    <div id="root">
      <div class="loader-container">
        <div class="loader-logo">🎁</div>
        <div class="loader-title">Antigravity Mobile</div>
        <div class="loader-sub">Starting on-device engine...</div>
      </div>
    </div>
    <script src="/prism_bundle.js"></script>
    <script>console.log("[Antigravity DIAG] Loading main.js...");</script>
    <script src="/main.js"></script>
    <script>
      console.log("[Antigravity DIAG] main.js script executed synchronously.");
      setInterval(function() {
          var root = document.getElementById("root");
          var hasLoader = root && root.querySelector(".loader-container");
          var diagErr = document.getElementById("__diag_err");
          var diagRej = document.getElementById("__diag_rejection");
          console.log("[Antigravity POLL] rootChildren=" + (root ? root.children.length : 0) + 
                      ", hasLoader=" + (!!hasLoader) + 
                      ", hasError=" + (!!diagErr) + 
                      ", hasRejection=" + (!!diagRej));
      }, 3000);
    </script>
  </body>
</html>
